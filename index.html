<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover,
      user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#081b12">
<title>Grindy Jump</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#081b12;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

#score{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 12px);
  left:15px;
  color:white;
  font-size:20px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#best{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 40px);
  left:15px;
  color:#d8ffe8;
  font-size:13px;
  text-shadow:0 2px 4px #000;
}

button{
  border:0;
  color:white;
  font-weight:bold;
  background:rgba(0,0,0,.42);
  border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

#fullscreen{
  pointer-events:auto;
  position:absolute;
  right:12px;
  top:calc(env(safe-area-inset-top) + 12px);
  width:48px;
  height:48px;
  border-radius:14px;
  font-size:22px;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  display:flex;
  justify-content:space-between;
  padding:0 22px;
  pointer-events:none;
}

.control{
  pointer-events:auto;
  width:88px;
  height:68px;
  border-radius:22px;
  font-size:30px;
  touch-action:none;
}

#startScreen,
#gameOver{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:
    radial-gradient(circle at center,rgba(33,120,67,.45),rgba(0,0,0,.85));
}

.panel{
  width:min(90%,400px);
  padding:30px 22px;
  border-radius:28px;
  background:rgba(3,20,11,.82);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 15px 60px rgba(0,0,0,.5);
  color:white;
}

.panel h1{
  margin:0 0 8px;
  font-size:42px;
}

.panel p{
  color:#d8e8dc;
  line-height:1.5;
}

.mainBtn{
  margin-top:15px;
  width:100%;
  height:58px;
  border-radius:18px;
  background:#29b85f;
  font-size:19px;
}

.hidden{
  display:none!important;
}

#hint{
  font-size:13px;
  opacity:.75;
  margin-top:15px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="score">Score : 0</div>
  <div id="best">Record : 0</div>

  <button id="fullscreen">⛶</button>

  <div id="controls">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>
</div>

<div id="startScreen">
  <div class="panel">
    <h1>GRINDY JUMP</h1>
    <p>
      Grimpe le plus haut possible.<br>
      Attrape les têtes et réalise ton meilleur score.
    </p>
    <button class="mainBtn" id="startBtn">JOUER</button>
    <div id="hint">
      Maintiens ◀ ou ▶ pour diriger Grindy
    </div>
  </div>
</div>

<div id="gameOver" class="hidden">
  <div class="panel">
    <h1>GAME OVER</h1>
    <p id="finalScore">Score : 0</p>
    <button class="mainBtn" id="restartBtn">REJOUER</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let dpr = Math.min(devicePixelRatio || 1,2);

function resize(){
  W = innerWidth;
  H = innerHeight;

  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();

let running=false;
let gameOver=false;

let score=0;
let best=Number(localStorage.getItem("grindyBest") || 0);

let cam=0;
let worldHeight=10000;

let keys={
  left:false,
  right:false
};

let player;
let platforms=[];
let collectibles=[];
let particles=[];

let audioCtx=null;

function sound(freq=500,duration=.06,type="sine"){
  try{
    if(!audioCtx)
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=freq;
    gain.gain.value=.045;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+duration
    );

    osc.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

function resetGame(){

  score=0;
  gameOver=false;

  platforms=[];
  collectibles=[];
  particles=[];

  const startY=H-125;

  player={
    x:W/2,
    y:startY,
    w:38,
    h:48,
    vx:0,
    vy:0,
    speed:0.65,
    jump:-12,
    grounded:false,
    grindTimer:0
  };

  /*
    IMPORTANT :
    La caméra utilise :
    écranY = mondeY - caméra

    Donc pour placer Grindy à environ 45% de l'écran :
    caméra = mondeY - position écran désirée
  */
  cam=player.y-H*.45;

  platforms.push({
    x:W/2-75,
    y:H-75,
    w:150,
    h:18
  });

  let y=H-155;
  let difficulty=0;

  while(y>-worldHeight){

    difficulty+=0.025;

    const width=Math.max(85,145-difficulty*30);

    const gap=Math.min(
      115,
      82+difficulty*12
    );

    const x=Math.random()*(W-width-30)+15;

    platforms.push({
      x:x,
      y:y,
      w:width,
      h:17
    });

    if(Math.random()<.72){
      collectibles.push({
        x:x+width/2,
        y:y-30,
        r:10,
        collected:false,
        spin:Math.random()*6
      });
    }

    y-=gap;
  }

  updateUI();
}

function updateUI(){
  document.getElementById("score").textContent=
    "Score : "+score;

  document.getElementById("best").textContent=
    "Record : "+best;
}

function startGame(){
  resetGame();

  document.getElementById("startScreen")
    .classList.add("hidden");

  document.getElementById("gameOver")
    .classList.add("hidden");

  running=true;

  sound(600,.08,"square");

  requestAnimationFrame(loop);
}

function endGame(){

  if(gameOver)return;

  gameOver=true;
  running=false;

  if(score>best){
    best=score;
    localStorage.setItem("grindyBest",best);
  }

  document.getElementById("finalScore").textContent=
    "Score : "+score+" — Record : "+best;

  document.getElementById("gameOver")
    .classList.remove("hidden");

  sound(140,.2,"sawtooth");
}

function spawnParticles(x,y,count=10){

  for(let i=0;i<count;i++){

    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,
      life:30+Math.random()*25,
      size:2+Math.random()*4
    });
  }
}

function update(){

  if(!running)return;

  const difficulty=
    Math.min(1,score/800);

  /*
    Direction
  */
  if(keys.left){
    player.vx-=player.speed;
  }

  if(keys.right){
    player.vx+=player.speed;
  }

  player.vx*=.88;

  player.vx=Math.max(
    -6,
    Math.min(6,player.vx)
  );

  player.x+=player.vx;

  /*
    Wrap horizontal
  */
  if(player.x<-player.w)
    player.x=W;

  if(player.x>W)
    player.x=-player.w;

  /*
    Gravity
  */
  player.vy+=.45;
  player.vy=Math.min(player.vy,14);

  const oldBottom=
    player.y+player.h;

  player.y+=player.vy;

  player.grounded=false;

  /*
    Platforms
  */
  if(player.vy>=0){

    for(const p of platforms){

      const newBottom=
        player.y+player.h;

      if(
        oldBottom<=p.y &&
        newBottom>=p.y &&
        player.x+player.w>p.x &&
        player.x<p.x+p.w
      ){

        player.y=p.y-player.h;
        player.vy=player.jump;
        player.grounded=true;

        player.grindTimer=10;

        score+=1;

        spawnParticles(
          player.x+player.w/2,
          p.y,
          7
        );

        sound(260,.045,"square");

        break;
      }
    }
  }

  /*
    Collectibles
  */
  for(const c of collectibles){

    if(c.collected)continue;

    c.spin+=.08;

    const dx=
      player.x+player.w/2-c.x;

    const dy=
      player.y+player.h/2-c.y;

    if(Math.sqrt(dx*dx+dy*dy)<26){

      c.collected=true;

      score+=10;

      player.grindTimer=22;

      spawnParticles(
        c.x,
        c.y,
        18
      );

      sound(850,.08,"triangle");
      updateUI();
    }
  }

  /*
    Camera
  */
  const desiredScreenY=H*.45;

  const targetCam=
    player.y-desiredScreenY;

  cam+=(targetCam-cam)*.20;

  /*
    Limites de caméra.
    On autorise les valeurs négatives :
    c'est indispensable pour suivre Grindy
    lorsqu'il monte dans le monde.
  */
  const minCam=-worldHeight;
  const maxCam=H;

  if(cam<minCam)cam=minCam;
  if(cam>maxCam)cam=maxCam;

  /*
    Score basé sur la hauteur
  */
  const heightScore=
    Math.max(
      0,
      Math.floor((H-150-player.y)/10)
    );

  if(heightScore>score)
    score=heightScore;

  /*
    Particules
  */
  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.08;

    p.life--;

    if(p.life<=0)
      particles.splice(i,1);
  }

  /*
    Game over :
    Grindy est réellement sous l'écran.
  */
  const screenPlayerY=
    player.y-cam;

  if(screenPlayerY>H+180){
    endGame();
  }

  updateUI();
}

function drawBackground(){

  const gradient=
    ctx.createLinearGradient(
      0,0,0,H
    );

  gradient.addColorStop(0,"#07170f");
  gradient.addColorStop(.55,"#103d24");
  gradient.addColorStop(1,"#06130b");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  /*
    Grande plante décorative
  */
  ctx.save();

  const plantX=W*.5;

  ctx.strokeStyle="rgba(34,140,70,.28)";
  ctx.lineWidth=45;
  ctx.beginPath();

  ctx.moveTo(
    plantX,
    H+200
  );

  ctx.bezierCurveTo(
    plantX-80,
    H*.6,
    plantX+100,
    H*.3,
    plantX,
    -200
  );

  ctx.stroke();

  ctx.lineWidth=4;

  for(let i=0;i<9;i++){

    const y=
      ((i*170+cam*.15)%(
        H+250
      ))-100;

    ctx.strokeStyle=
      "rgba(70,190,95,.16)";

    ctx.beginPath();

    ctx.moveTo(
      plantX,
      y+80
    );

    ctx.quadraticCurveTo(
      plantX-100,
      y,
      plantX-180,
      y+35
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      plantX,
      y+80
    );

    ctx.quadraticCurveTo(
      plantX+100,
      y,
      plantX+180,
      y+35
    );

    ctx.stroke();
  }

  ctx.restore();
}

function drawPlatform(p){

  const sy=p.y-cam;

  if(sy<-50 || sy>H+50)
    return;

  ctx.save();

  ctx.fillStyle="#45a85c";

  ctx.beginPath();

  ctx.roundRect(
    p.x,
    sy,
    p.w,
    p.h,
    8
  );

  ctx.fill();

  ctx.fillStyle="#8bdc7e";

  ctx.fillRect(
    p.x,
    sy,
    p.w,
    4
  );

  ctx.restore();
}

function drawCollectible(c){

  if(c.collected)return;

  const sy=c.y-cam;

  if(sy<-40 || sy>H+40)
    return;

  ctx.save();

  ctx.translate(c.x,sy);

  const s=
    .75+
    Math.abs(Math.sin(c.spin))*.25;

  ctx.scale(s,1);

  /*
    Tête stylisée
  */
  ctx.fillStyle="#d8c7a0";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    c.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#19130f";

  ctx.beginPath();
  ctx.arc(-3,-2,1.5,0,Math.PI*2);
  ctx.arc(3,-2,1.5,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#19130f";
  ctx.lineWidth=1.5;

  ctx.beginPath();

  ctx.arc(
    0,
    2,
    4,
    0,
    Math.PI
  );

  ctx.stroke();

  ctx.restore();
}

function drawPlayer(){

  const sx=player.x;
  const sy=player.y-cam;

  /*
    Ombre
  */
  ctx.fillStyle="rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    sx+player.w/2,
    sy+player.h+5,
    23,
    6,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Corps
  */
  ctx.fillStyle="#d7e1d8";

  ctx.beginPath();

  ctx.roundRect(
    sx+7,
    sy+12,
    24,
    27,
    9
  );

  ctx.fill();

  /*
    Tête
  */
  ctx.fillStyle="#e5d1ad";

  ctx.beginPath();

  ctx.arc(
    sx+19,
    sy+11,
    11,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Bonnet / cheveux
  */
  ctx.fillStyle="#171b18";

  ctx.beginPath();

  ctx.arc(
    sx+19,
    sy+7,
    11,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  /*
    Yeux
  */
  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    sx+15,
    sy+11,
    1.5,
    0,
    Math.PI*2
  );

  ctx.arc(
    sx+23,
    sy+11,
    1.5,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Bras
  */
  ctx.strokeStyle="#e5d1ad";
  ctx.lineWidth=5;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    sx+8,
    sy+20
  );

  ctx.lineTo(
    sx-2,
    sy+29
  );

  ctx.moveTo(
    sx+30,
    sy+20
  );

  ctx.lineTo(
    sx+40,
    sy+29
  );

  ctx.stroke();

  /*
    Jambes
  */
  ctx.strokeStyle="#d7e1d8";
  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(
    sx+13,
    sy+38
  );

  ctx.lineTo(
    sx+8,
    sy+49
  );

  ctx.moveTo(
    sx+25,
    sy+38
  );

  ctx.lineTo(
    sx+30,
    sy+49
  );

  ctx.stroke();

  /*
    Effet grind
  */
  if(player.grindTimer>0){

    player.grindTimer--;

    ctx.strokeStyle=
      "rgba(255,220,80,.9)";

    ctx.lineWidth=2;

    for(let i=0;i<3;i++){

      ctx.beginPath();

      ctx.moveTo(
        sx-5-i*4,
        sy+42+i*3
      );

      ctx.lineTo(
        sx-15-i*7,
        sy+46+i*3
      );

      ctx.stroke();
    }
  }
}

function drawParticles(){

  for(const p of particles){

    const sy=p.y-cam;

    ctx.globalAlpha=
      Math.max(0,p.life/50);

    ctx.fillStyle="#b8f28a";

    ctx.fillRect(
      p.x,
      sy,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}

function draw(){

  drawBackground();

  for(const p of platforms)
    drawPlatform(p);

  for(const c of collectibles)
    drawCollectible(c);

  drawParticles();

  drawPlayer();
}

function loop(){

  if(!running)return;

  update();
  draw();

  requestAnimationFrame(loop);
}

/*
  Contrôles clavier
*/
addEventListener("keydown",e=>{

  if(
    e.key==="ArrowLeft" ||
    e.key.toLowerCase()==="a"
  ){
    keys.left=true;
  }

  if(
    e.key==="ArrowRight" ||
    e.key.toLowerCase()==="d"
  ){
    keys.right=true;
  }
});

addEventListener("keyup",e=>{

  if(
    e.key==="ArrowLeft" ||
    e.key.toLowerCase()==="a"
  ){
    keys.left=false;
  }

  if(
    e.key==="ArrowRight" ||
    e.key.toLowerCase()==="d"
  ){
    keys.right=false;
  }
});

/*
  Contrôles tactiles
*/
function touchControl(button,key){

  const down=e=>{
    e.preventDefault();
    keys[key]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  button.addEventListener("touchstart",down,{
    passive:false
  });

  button.addEventListener("touchend",up,{
    passive:false
  });

  button.addEventListener("touchcancel",up,{
    passive:false
  });

  button.addEventListener("mousedown",down);
  button.addEventListener("mouseup",up);
  button.addEventListener("mouseleave",up);
}

touchControl(
  document.getElementById("left"),
  "left"
);

touchControl(
  document.getElementById("right"),
  "right"
);

/*
  Boutons
*/
document.getElementById("startBtn")
  .addEventListener("click",startGame);

document.getElementById("restartBtn")
  .addEventListener("click",startGame);

/*
  Plein écran
*/
document.getElementById("fullscreen")
.addEventListener("click",async()=>{

  try{

    if(document.fullscreenElement){

      await document.exitFullscreen();

    }else if(
      document.documentElement.requestFullscreen
    ){

      await document.documentElement.requestFullscreen();

    }else if(
      document.documentElement.webkitRequestFullscreen
    ){

      document.documentElement.webkitRequestFullscreen();
    }

  }catch(e){}
});

/*
  Empêche le défilement iPhone
*/
document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

resetGame();
draw();
</script>

</body>
</html>
