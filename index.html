<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Grindy Jump V6</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071b0b;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  background:#071b0b;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

#score{
  position:absolute;
  top:18px;
  left:18px;
  color:white;
  font-size:22px;
  font-weight:bold;
  text-shadow:0 2px 4px #000;
}

#best{
  position:absolute;
  top:48px;
  left:18px;
  color:#b9ffbf;
  font-size:14px;
  text-shadow:0 2px 4px #000;
}

#startScreen,
#gameOver{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,20,5,.72);
  color:white;
  text-align:center;
  pointer-events:auto;
}

#startScreen h1,
#gameOver h1{
  margin:0 0 10px;
  font-size:44px;
  text-shadow:0 4px 12px #000;
}

#startScreen p,
#gameOver p{
  margin:8px 20px;
  font-size:17px;
}

button{
  border:0;
  border-radius:18px;
  padding:15px 28px;
  margin-top:18px;
  font-size:19px;
  font-weight:bold;
  color:white;
  background:#21a849;
  box-shadow:0 5px 0 #116528;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #116528;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  display:flex;
  justify-content:space-between;
  padding:0 22px;
  pointer-events:none;
}

.control{
  width:90px;
  height:70px;
  border-radius:24px;
  background:rgba(255,255,255,.16);
  border:2px solid rgba(255,255,255,.3);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  pointer-events:auto;
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

#fullscreen{
  position:absolute;
  top:18px;
  right:18px;
  width:48px;
  height:48px;
  padding:0;
  margin:0;
  border-radius:15px;
  font-size:22px;
  background:rgba(255,255,255,.16);
  box-shadow:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

  <div id="score">Score : 0</div>
  <div id="best">Record : 0</div>

  <button id="fullscreen">⛶</button>

  <div id="startScreen">
    <h1>🌿 Grindy Jump</h1>
    <p>Monte le plus haut possible !</p>
    <p>Récupère les têtes et réalise des grinds.</p>
    <button id="startBtn">JOUER</button>
  </div>

  <div id="gameOver" style="display:none">
    <h1>💥 Oups !</h1>
    <p id="finalScore">Score : 0</p>
    <button id="restartBtn">REJOUER</button>
  </div>

  <div id="controls">
    <div class="control" id="left">◀</div>
    <div class="control" id="right">▶</div>
  </div>

</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let dpr=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const startScreen=document.getElementById("startScreen");
const gameOver=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");

let running=false;
let score=0;
let best=Number(localStorage.getItem("grindyBest")||0);

bestEl.textContent="Record : "+best;

let keys={
  left:false,
  right:false
};

let player;
let platforms=[];
let collectibles=[];
let particles=[];

let cam=0;
let worldHeight=5000;

let lastTime=0;
let audioCtx=null;

function sound(freq,duration=.08,type="sine"){
  try{
    if(!audioCtx)
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(.06,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

function resetGame(){

  score=0;
  cam=0;

  player={
    x:W/2,
    y:H-160,
    vx:0,
    vy:0,
    w:34,
    h:46,
    rotation:0,
    grind:0
  };

  platforms=[];
  collectibles=[];
  particles=[];

  const baseY=H-80;

  platforms.push({
    x:W/2-100,
    y:baseY,
    w:200,
    h:18
  });

  let y=baseY-90;
  let lastX=W/2-100;

  while(y>-worldHeight){

    let gap=75+Math.random()*25;

    let minX=20;
    let maxX=Math.max(20,W-150);

    let x=lastX+(Math.random()*180-90);

    x=Math.max(minX,Math.min(maxX,x));

    platforms.push({
      x,
      y,
      w:120+Math.random()*60,
      h:16
    });

    if(Math.random()<.75){

      collectibles.push({
        x:x+50,
        y:y-38,
        r:13,
        taken:false,
        spin:Math.random()*Math.PI*2
      });

    }

    lastX=x;
    y-=gap;
  }

  running=true;

  startScreen.style.display="none";
  gameOver.style.display="none";

  lastTime=performance.now();
}

function spawnParticles(x,y){

  for(let i=0;i<10;i++){

    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.8)*5,
      life:1,
      size:3+Math.random()*4
    });

  }
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    let p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.12;
    p.life-=dt*2;

    if(p.life<=0)
      particles.splice(i,1);
  }
}

function update(dt){

  if(!running)return;

  const speed=0.55;

  if(keys.left)
    player.vx-=speed;

  if(keys.right)
    player.vx+=speed;

  player.vx*=.88;

  player.vx=Math.max(-7,Math.min(7,player.vx));

  player.x+=player.vx;

  // Passage d'un côté à l'autre
  if(player.x<-player.w)
    player.x=W;

  if(player.x>W)
    player.x=-player.w;

  player.vy+=.38;

  player.y+=player.vy;

  player.rotation=player.vx*.05;

  // Collision plateformes
  if(player.vy>0){

    for(const p of platforms){

      const bottom=player.y+player.h/2;
      const previousBottom=bottom-player.vy;

      if(
        previousBottom<=p.y &&
        bottom>=p.y &&
        player.x+player.w/2>p.x &&
        player.x-player.w/2<p.x+p.w
      ){

        player.y=p.y-player.h/2;
        player.vy=-10.8;

        player.grind=.35;

        spawnParticles(
          player.x,
          p.y
        );

        sound(280,.07,"square");

        break;
      }
    }
  }

  player.grind=Math.max(0,player.grind-dt);

  // Collectibles
  for(const c of collectibles){

    if(c.taken)continue;

    c.spin+=dt*5;

    const dx=player.x-c.x;
    const dy=player.y-c.y;

    if(Math.sqrt(dx*dx+dy*dy)<30){

      c.taken=true;

      score+=10;

      spawnParticles(c.x,c.y);

      sound(700,.09,"sine");
    }
  }

  // Score selon la hauteur
  const heightScore=Math.max(
    0,
    Math.floor((H-160-player.y)/10)
  );

  score=Math.max(score,heightScore);

  scoreEl.textContent="Score : "+score;

  if(score>best){
    best=score;
    localStorage.setItem("grindyBest",best);
    bestEl.textContent="Record : "+best;
  }

  /*
   * NOUVELLE CAMÉRA V6
   *
   * La caméra anticipe la montée de Grindy.
   * Elle garde le personnage dans la partie
   * centrale/basse de l'écran.
   */

  let targetCam=player.y-H*0.62;

  cam+=(targetCam-cam)*0.18;

  if(cam<0)
    cam=0;

  const maxCam=Math.max(
    0,
    worldHeight-H
  );

  if(cam>maxCam)
    cam=maxCam;

  updateParticles(dt);

  // Game over
  if(player.y-cam>H+120){

    running=false;

    finalScore.textContent=
      "Score : "+score+
      " • Record : "+best;

    gameOver.style.display="flex";

    sound(100,.25,"sawtooth");
  }
}

function drawBackground(){

  const gradient=ctx.createLinearGradient(
    0,0,0,H
  );

  gradient.addColorStop(0,"#071b0b");
  gradient.addColorStop(.5,"#0d4219");
  gradient.addColorStop(1,"#031006");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  // Lueurs
  ctx.globalAlpha=.15;

  for(let i=0;i<8;i++){

    const x=(i*137)%W;
    const y=((i*280-cam*.15)%H+H)%H;

    ctx.beginPath();
    ctx.arc(x,y,80,0,Math.PI*2);
    ctx.fillStyle="#5aff70";
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function drawGiantPlant(){

  const baseX=W*.5;
  const baseY=worldHeight-cam+500;

  ctx.save();

  ctx.strokeStyle="#184d20";
  ctx.lineWidth=35;

  ctx.beginPath();
  ctx.moveTo(baseX,baseY);
  ctx.bezierCurveTo(
    baseX-30,
    baseY-700,
    baseX+50,
    baseY-1400,
    baseX,
    baseY-2300
  );
  ctx.stroke();

  for(let i=0;i<12;i++){

    const y=baseY-i*190;

    const side=i%2===0?-1:1;

    ctx.fillStyle="#246b2c";

    ctx.beginPath();

    ctx.ellipse(
      baseX+side*100,
      y,
      140,
      45,
      side*.4,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}

function drawPlatforms(){

  for(const p of platforms){

    const sy=p.y+cam;

    if(sy<-50||sy>H+50)
      continue;

    ctx.fillStyle="#7a4d2c";

    ctx.fillRect(
      p.x,
      sy,
      p.w,
      p.h
    );

    ctx.fillStyle="#38a94a";

    ctx.fillRect(
      p.x,
      sy,
      p.w,
      7
    );

    ctx.fillStyle="#70d66e";

    ctx.fillRect(
      p.x+10,
      sy-2,
      p.w*.3,
      3
    );
  }
}

function drawCollectibles(){

  for(const c of collectibles){

    if(c.taken)continue;

    const sy=c.y+cam;

    if(sy<-40||sy>H+40)
      continue;

    ctx.save();

    ctx.translate(c.x,sy);

    ctx.rotate(c.spin);

    // tête
    ctx.fillStyle="#a8ef8d";

    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();

    // yeux
    ctx.fillStyle="#173719";

    ctx.beginPath();
    ctx.arc(-4,-2,2,0,Math.PI*2);
    ctx.arc(4,-2,2,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#173719";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(0,3,5,0,Math.PI);
    ctx.stroke();

    ctx.restore();
  }
}

function drawPlayer(){

  const x=player.x;
  const y=player.y+cam;

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(player.rotation);

  // Ombre
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath();
  ctx.ellipse(
    0,
    25,
    22,
    7,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();

  // Jambes
  ctx.strokeStyle="#222";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-7,15);
  ctx.lineTo(-12,27);
  ctx.moveTo(7,15);
  ctx.lineTo(13,27);
  ctx.stroke();

  // Corps
  ctx.fillStyle="#222";

  ctx.fillRect(
    -14,
    -5,
    28,
    27
  );

  // T-shirt
  ctx.fillStyle="#45c95a";

  ctx.fillRect(
    -13,
    -5,
    26,
    18
  );

  // Tête
  ctx.fillStyle="#d69a70";

  ctx.beginPath();
  ctx.arc(
    0,
    -18,
    14,
    0,
    Math.PI*2
  );
  ctx.fill();

  // Casquette
  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(
    0,
    -23,
    14,
    Math.PI,
    Math.PI*2
  );
  ctx.fill();

  ctx.fillRect(
    -14,
    -23,
    24,
    5
  );

  // Visage
  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(-5,-18,2,0,Math.PI*2);
  ctx.arc(5,-18,2,0,Math.PI*2);
  ctx.fill();

  // Bras
  ctx.strokeStyle="#d69a70";
  ctx.lineWidth=6;

  ctx.beginPath();

  if(player.grind>0){

    ctx.moveTo(-12,0);
    ctx.lineTo(-25,10);

    ctx.moveTo(12,0);
    ctx.lineTo(25,10);

  }else{

    ctx.moveTo(-12,0);
    ctx.lineTo(-20,8);

    ctx.moveTo(12,0);
    ctx.lineTo(20,8);
  }

  ctx.stroke();

  ctx.restore();

  // Effet grind
  if(player.grind>0){

    ctx.save();

    ctx.globalAlpha=.8;

    ctx.strokeStyle="#b6ff5c";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(x-28,y+28);
    ctx.lineTo(x+28,y+28);

    ctx.stroke();

    ctx.restore();
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=Math.max(0,p.life);

    ctx.fillStyle="#9aff65";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y+cam,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function draw(){

  drawBackground();

  drawGiantPlant();

  drawPlatforms();

  drawCollectibles();

  drawParticles();

  drawPlayer();
}

function loop(time){

  const dt=Math.min(
    .033,
    (time-lastTime)/1000||0
  );

  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

function setControl(element,direction){

  const down=e=>{
    e.preventDefault();
    keys[direction]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[direction]=false;
  };

  element.addEventListener("touchstart",down,{
    passive:false
  });

  element.addEventListener("touchend",up,{
    passive:false
  });

  element.addEventListener("touchcancel",up,{
    passive:false
  });

  element.addEventListener("mousedown",down);
  element.addEventListener("mouseup",up);
  element.addEventListener("mouseleave",up);
}

setControl(
  document.getElementById("left"),
  "left"
);

setControl(
  document.getElementById("right"),
  "right"
);

addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
    keys.left=true;

  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
    keys.right=true;
});

addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
    keys.left=false;

  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
    keys.right=false;
});

document.getElementById("startBtn")
.addEventListener("click",()=>{

  sound(500,.06);
  resetGame();
});

document.getElementById("restartBtn")
.addEventListener("click",()=>{

  sound(500,.06);
  resetGame();
});

document.getElementById("fullscreen")
.addEventListener("click",async()=>{

  try{

    if(document.documentElement.requestFullscreen)
      await document.documentElement.requestFullscreen();

  }catch(e){}
});

// Empêche le scroll/bounce iPhone
document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);
</script>

</body>
</html>
