<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#081b12">
<title>Grindy Jump</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#06120c;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
}

#scoreBox,#bestBox{
  position:absolute;
  top:max(18px,env(safe-area-inset-top));
  padding:8px 12px;
  border:1px solid rgba(170,230,150,.25);
  border-radius:14px;
  background:rgba(4,18,10,.65);
  color:#eaffdf;
  font-weight:800;
  backdrop-filter:blur(8px);
}

#scoreBox{
  left:14px;
}

#bestBox{
  right:14px;
}

#fullscreen{
  position:absolute;
  right:14px;
  top:72px;
  pointer-events:auto;
  border:0;
  border-radius:14px;
  padding:10px 13px;
  background:rgba(4,18,10,.75);
  color:white;
  font-size:18px;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:max(18px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.control{
  width:82px;
  height:82px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(5,25,13,.65);
  color:white;
  font-size:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:auto;
  user-select:none;
  -webkit-user-select:none;
}

.control:active{
  transform:scale(.94);
  background:rgba(45,100,50,.85);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(0,10,5,.48);
}

.panel{
  width:min(440px,92vw);
  padding:30px 24px;
  border-radius:26px;
  text-align:center;
  color:white;
  background:rgba(5,25,13,.9);
  border:1px solid rgba(155,230,125,.25);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

h1{
  margin:0 0 12px;
  font-size:42px;
  letter-spacing:2px;
}

.panel p{
  line-height:1.5;
  color:#d5e8d0;
}

button.main{
  margin-top:14px;
  padding:14px 28px;
  border:0;
  border-radius:16px;
  background:#65bd55;
  color:#071208;
  font-size:18px;
  font-weight:900;
}

.hint{
  margin-top:18px;
  font-size:13px;
  opacity:.7;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="scoreBox">Score : <span id="score">0</span></div>
  <div id="bestBox">Record : <span id="best">0</span></div>
  <button id="fullscreen">⛶</button>

  <div id="controls">
    <div id="left" class="control">◀</div>
    <div id="right" class="control">▶</div>
  </div>
</div>

<div id="startScreen" class="overlay">
  <div class="panel">
    <h1>GRINDY JUMP</h1>
    <p>
      Grindy est ton grinder.<br>
      Saute sur le plant géant et attrape les têtes.
    </p>

    <button id="startBtn" class="main">JOUER</button>

    <div class="hint">
      Maintiens ◀ ou ▶ pour diriger le grinder
    </div>
  </div>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <h1>GAME OVER</h1>

    <p>
      Score : <strong id="finalScore">0</strong>
    </p>

    <button id="restartBtn" class="main">
      REJOUER
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1,2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W*dpr;
  canvas.height = H*dpr;

  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

let running = false;
let gameOver = false;

let score = 0;
let best = Number(localStorage.getItem("grindyBest") || 0);

let cam = 0;
let worldHeight = 0;

let keys = {
  left:false,
  right:false
};

let player;
let platforms = [];
let collectibles = [];
let particles = [];

document.getElementById("best").textContent = best;

function sound(type){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC)return;

    const ac = new AC();
    const osc = ac.createOscillator();
    const gain = ac.createGain();

    osc.connect(gain);
    gain.connect(ac.destination);

    if(type === "jump"){
      osc.frequency.value = 430;
    }else if(type === "collect"){
      osc.frequency.value = 720;
    }else{
      osc.frequency.value = 180;
    }

    gain.gain.setValueAtTime(.04,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);

    osc.start();
    osc.stop(ac.currentTime+.12);
  }catch(e){}
}

function resetGame(){

  score = 0;
  cam = 0;
  worldHeight = 0;

  platforms = [];
  collectibles = [];
  particles = [];

  player = {
    x:W/2-18,
    y:H-130,
    w:36,
    h:34,
    vx:0,
    vy:-11,
    grindTimer:0
  };

  let y = H-60;

  platforms.push({
    x:W/2-75,
    y:y,
    w:150,
    h:18
  });

  y -= 90;

  while(y > -5000){

    const w = 100 + Math.random()*55;

    const minX = 10;
    const maxX = Math.max(minX,W-w-10);

    const x = minX + Math.random()*Math.max(1,maxX-minX);

    platforms.push({
      x:x,
      y:y,
      w:w,
      h:17
    });

    if(Math.random() < .85){

      collectibles.push({
        x:x+w/2,
        y:y-42,
        r:13,
        collected:false,
        spin:Math.random()*10
      });

    }

    y -= 75 + Math.random()*55;
  }

  worldHeight = Math.abs(y);

  updateUI();
}

function updateUI(){

  document.getElementById("score").textContent = score;
  document.getElementById("best").textContent = best;
}

function startGame(){

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOver").classList.add("hidden");

  resetGame();

  running = true;
  gameOver = false;

  sound("jump");
}

function endGame(){

  running = false;
  gameOver = true;

  if(score > best){
    best = score;
    localStorage.setItem("grindyBest",best);
  }

  document.getElementById("finalScore").textContent = score;
  document.getElementById("best").textContent = best;

  document.getElementById("gameOver").classList.remove("hidden");

  sound("over");
}

function spawnParticles(x,y){

  for(let i=0;i<12;i++){

    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.8)*5,
      life:30+Math.random()*20,
      size:2+Math.random()*3
    });
  }
}

function update(){

  if(!running)return;

  const acceleration = .65;
  const maxSpeed = 6;

  if(keys.left){
    player.vx -= acceleration;
  }

  if(keys.right){
    player.vx += acceleration;
  }

  if(!keys.left && !keys.right){
    player.vx *= .88;
  }

  player.vx = Math.max(-maxSpeed,Math.min(maxSpeed,player.vx));

  const previousBottom = player.y + player.h;

  player.vy += .42;
  player.vy = Math.min(player.vy,13);

  player.x += player.vx;
  player.y += player.vy;

  if(player.x < -player.w){
    player.x = W;
  }

  if(player.x > W){
    player.x = -player.w;
  }

  if(player.vy > 0){

    for(const p of platforms){

      const playerBottom = player.y + player.h;

      const horizontal =
        player.x + player.w > p.x &&
        player.x < p.x + p.w;

      const crossed =
        previousBottom <= p.y &&
        playerBottom >= p.y;

      if(horizontal && crossed){

        player.y = p.y-player.h;
        player.vy = -11;

        spawnParticles(
          player.x+player.w/2,
          p.y
        );

        sound("jump");

        break;
      }
    }
  }

  const targetCam =
    player.y - H*.45;

  if(targetCam < cam){

    cam += (targetCam-cam)*.12;
  }

  for(const c of collectibles){

    c.spin += .08;

    if(c.collected)continue;

    const dx =
      player.x+player.w/2-c.x;

    const dy =
      player.y+player.h/2-c.y;

    const distance =
      Math.sqrt(dx*dx+dy*dy);

    if(distance < c.r+22){

      c.collected = true;

      score++;

      player.grindTimer = 18;

      spawnParticles(c.x,c.y);

      sound("collect");

      updateUI();
    }
  }

  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vy += .12;
    p.life--;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }

  if(player.y-cam > H+180){

    endGame();
  }
}

function drawBackground(){

  const g =
    ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#06120c");
  g.addColorStop(.45,"#0d321c");
  g.addColorStop(1,"#06150b");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  const glow =
    ctx.createRadialGradient(
      W*.5,
      H*.42,
      10,
      W*.5,
      H*.42,
      Math.max(W,H)*.75
    );

  glow.addColorStop(
    0,
    "rgba(91,205,105,.18)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  ctx.save();

  const px = W*.5;
  const sway = Math.sin(cam*.003)*18;

  /*
    TIGE DU PLANT GEANT
  */

  ctx.strokeStyle = "#245d31";
  ctx.lineWidth = Math.max(28,W*.075);
  ctx.lineCap = "round";

  ctx.beginPath();

  ctx.moveTo(
    px+sway,
    H+180
  );

  ctx.bezierCurveTo(
    px-55+sway,
    H*.72,
    px+65+sway,
    H*.43,
    px+sway,
    -180
  );

  ctx.stroke();

  ctx.strokeStyle =
    "rgba(110,190,88,.5)";

  ctx.lineWidth = 7;

  ctx.beginPath();

  ctx.moveTo(
    px+sway,
    H+180
  );

  ctx.bezierCurveTo(
    px-55+sway,
    H*.72,
    px+65+sway,
    H*.43,
    px+sway,
    -180
  );

  ctx.stroke();

  function leaf(x,y,rx,ry,a,alpha){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(a);
    ctx.globalAlpha=alpha;

    const lg =
      ctx.createLinearGradient(
        -rx,0,rx,0
      );

    lg.addColorStop(0,"#195c2d");
    lg.addColorStop(.5,"#62bd55");
    lg.addColorStop(1,"#174b28");

    ctx.fillStyle=lg;

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.bezierCurveTo(
      -rx*.35,
      -ry*.45,
      -rx*.85,
      -ry*.85,
      -rx,
      -ry*.12
    );

    ctx.bezierCurveTo(
      -rx*.72,
      ry*.35,
      -rx*.28,
      ry*.48,
      0,
      0
    );

    ctx.bezierCurveTo(
      rx*.28,
      ry*.48,
      rx*.72,
      ry*.35,
      rx,
      -ry*.12
    );

    ctx.bezierCurveTo(
      rx*.85,
      -ry*.85,
      rx*.35,
      -ry*.45,
      0,
      0
    );

    ctx.fill();

    ctx.strokeStyle =
      "rgba(190,240,135,.4)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(0,0);
    ctx.lineTo(rx*.82,0);

    ctx.moveTo(0,0);
    ctx.lineTo(-rx*.82,0);

    ctx.stroke();

    ctx.restore();
  }

  const off = (cam*.12)%H;

  const levels=[
    [-155,110,.35,-.55],
    [-70,90,.3,.65],
    [70,125,.4,-.35],
    [185,105,.32,.52],
    [310,145,.42,-.58],
    [455,115,.36,.48],
    [590,150,.43,-.42],
    [735,120,.34,.55]
  ];

  for(
    const [yy,rx,ry,a] of levels
  ){

    const y =
      ((yy-off+H+250)%(H+500))-250;

    leaf(
      px-35,
      y,
      rx,
      ry,
      a,
      .72
    );

    leaf(
      px+35,
      y+18,
      rx*.92,
      ry*.9,
      -a,
      .68
    );
  }

  /*
    PETITES FEUILLES FLOTTANTES
  */

  for(let i=0;i<14;i++){

    const x =
      (i*91+
      Math.sin(i*4.7)*45)%W;

    const y =
      ((i*137-cam*.18)%
      (H+180)+H+180)-
      90;

    ctx.globalAlpha=.14;
    ctx.fillStyle="#8ae176";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y,
      18,
      7,
      Math.sin(i)*.7,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;

  ctx.restore();
}

function drawPlatform(p){

  const sy = p.y-cam;

  if(
    sy<-50 ||
    sy>H+50
  )return;

  ctx.save();

  ctx.shadowColor =
    "rgba(0,0,0,.35)";

  ctx.shadowBlur=10;

  ctx.fillStyle="#75482a";

  ctx.beginPath();

  ctx.roundRect(
    p.x,
    sy,
    p.w,
    p.h,
    9
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#59aa4e";

  ctx.beginPath();

  ctx.roundRect(
    p.x,
    sy,
    p.w,
    6,
    5
  );

  ctx.fill();

  ctx.fillStyle="#a2df72";

  ctx.fillRect(
    p.x+8,
    sy+1,
    Math.max(12,p.w-16),
    2
  );

  ctx.restore();
}

function drawCollectible(c){

  if(c.collected)return;

  const sy = c.y-cam;

  if(
    sy<-45 ||
    sy>H+45
  )return;

  ctx.save();

  ctx.translate(
    c.x,
    sy
  );

  const p =
    .92+
    Math.sin(c.spin*1.7)*.08;

  ctx.scale(p,p);

  ctx.shadowColor =
    "rgba(242,211,123,.7)";

  ctx.shadowBlur=12;

  ctx.fillStyle="#e5d09d";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    c.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  /*
    VISAGE DE LA TÊTE
  */

  ctx.fillStyle="#1a2419";

  ctx.beginPath();

  ctx.arc(
    -3.3,
    -2,
    1.5,
    0,
    Math.PI*2
  );

  ctx.arc(
    3.3,
    -2,
    1.5,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#4d321d";
  ctx.lineWidth=1.7;

  ctx.beginPath();

  ctx.arc(
    0,
    2.2,
    4,
    0,
    Math.PI
  );

  ctx.stroke();

  ctx.restore();
}

function drawPlayer(){

  const sx = player.x;
  const sy = player.y-cam;

  /*
    OMBRE
  */

  ctx.fillStyle =
    "rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    sx+player.w/2,
    sy+player.h+6,
    25,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.save();

  ctx.translate(
    sx+player.w/2,
    sy+player.h/2
  );

  ctx.rotate(
    Math.max(
      -.16,
      Math.min(
        .16,
        player.vx*.025
      )
    )
  );

  /*
    GRINDY
    GRINDER METALLIQUE
  */

  const metal =
    ctx.createLinearGradient(
      -18,
      0,
      18,
      0
    );

  metal.addColorStop(
    0,
    "#34393b"
  );

  metal.addColorStop(
    .22,
    "#b5bcbd"
  );

  metal.addColorStop(
    .5,
    "#f0f2ef"
  );

  metal.addColorStop(
    .72,
    "#7c8587"
  );

  metal.addColorStop(
    1,
    "#292e30"
  );

  ctx.shadowColor =
    "rgba(0,0,0,.55)";

  ctx.shadowBlur=10;

  ctx.fillStyle=metal;

  ctx.beginPath();

  ctx.roundRect(
    -18,
    -17,
    36,
    34,
    12
  );

  ctx.fill();

  ctx.shadowBlur=0;

  /*
    SEPARATION DU GRINDER
  */

  ctx.strokeStyle="#252a2b";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(-16,0);
  ctx.lineTo(16,0);

  ctx.stroke();

  /*
    STRIES
  */

  ctx.lineWidth=2;

  for(
    let i=-12;
    i<=12;
    i+=6
  ){

    ctx.beginPath();

    ctx.moveTo(i,-13);
    ctx.lineTo(i,-7);

    ctx.stroke();
  }

  /*
    X CENTRAL
  */

  ctx.strokeStyle="#2b3031";

  ctx.beginPath();

  ctx.moveTo(-6,-4);
  ctx.lineTo(6,4);

  ctx.moveTo(6,-4);
  ctx.lineTo(-6,4);

  ctx.stroke();

  /*
    REFLET METALLIQUE
  */

  ctx.strokeStyle =
    "rgba(255,255,255,.75)";

  ctx.beginPath();

  ctx.arc(
    -6,
    -7,
    7,
    -2.7,
    -1.1
  );

  ctx.stroke();

  /*
    BORD INFERIEUR
  */

  ctx.strokeStyle="#111516";

  ctx.beginPath();

  ctx.arc(
    0,
    12,
    11,
    .15,
    Math.PI-.15
  );

  ctx.stroke();

  ctx.restore();

  /*
    ANIMATION DE GRIND
  */

  if(player.grindTimer>0){

    player.grindTimer--;

    ctx.strokeStyle =
      "rgba(255,218,91,.95)";

    ctx.lineWidth=2;
    ctx.lineCap="round";

    for(let i=0;i<5;i++){

      const a =
        i*.8+
        player.grindTimer*.18;

      const x =
        sx+
        player.w/2+
        Math.cos(a)*18;

      const y =
        sy+
        player.h/2+
        Math.sin(a)*18;

      ctx.beginPath();

      ctx.moveTo(x,y);

      ctx.lineTo(
        x+Math.cos(a)*7,
        y+Math.sin(a)*7
      );

      ctx.stroke();
    }

    ctx.strokeStyle =
      "rgba(126,230,104,.28)";

    ctx.beginPath();

    ctx.arc(
      sx+player.w/2,
      sy+player.h/2,
      23,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }
}

function drawParticles(){

  for(const p of particles){

    const sy = p.y-cam;

    if(
      sy<-20 ||
      sy>H+20
    )continue;

    ctx.globalAlpha =
      Math.max(
        0,
        p.life/50
      );

    ctx.fillStyle="#c8ef8c";

    ctx.beginPath();

    ctx.arc(
      p.x,
      sy,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function draw(){

  drawBackground();

  for(const p of platforms){
    drawPlatform(p);
  }

  for(const c of collectibles){
    drawCollectible(c);
  }

  drawParticles();

  if(player){
    drawPlayer();
  }
}

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}

function touchControl(element,direction){

  const start = e => {
    e.preventDefault();
    keys[direction]=true;
  };

  const end = e => {
    e.preventDefault();
    keys[direction]=false;
  };

  element.addEventListener(
    "touchstart",
    start,
    {passive:false}
  );

  element.addEventListener(
    "touchend",
    end,
    {passive:false}
  );

  element.addEventListener(
    "touchcancel",
    end,
    {passive:false}
  );

  element.addEventListener(
    "mousedown",
    start
  );

  element.addEventListener(
    "mouseup",
    end
  );

  element.addEventListener(
    "mouseleave",
    end
  );
}

touchControl(
  document.getElementById("left"),
  "left"
);

touchControl(
  document.getElementById("right"),
  "right"
);

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key==="ArrowLeft" ||
      e.key==="a" ||
      e.key==="q"
    ){
      keys.left=true;
    }

    if(
      e.key==="ArrowRight" ||
      e.key==="d"
    ){
      keys.right=true;
    }
  }
);

document.addEventListener(
  "keyup",
  e => {

    if(
      e.key==="ArrowLeft" ||
      e.key==="a" ||
      e.key==="q"
    ){
      keys.left=false;
    }

    if(
      e.key==="ArrowRight" ||
      e.key==="d"
    ){
      keys.right=false;
    }
  }
);

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  startGame
);

document.getElementById(
  "restartBtn"
).addEventListener(
  "click",
  startGame
);

document.getElementById(
  "fullscreen"
).addEventListener(
  "click",
  async () => {

    try{

      if(
        !document.fullscreenElement &&
        !document.webkitFullscreenElement
      ){

        if(
          document.documentElement.requestFullscreen
        ){

          await document.documentElement.requestFullscreen();

        }else if(
          document.documentElement.webkitRequestFullscreen
        ){

          document.documentElement.webkitRequestFullscreen();
        }

      }else{

        if(document.exitFullscreen){

          await document.exitFullscreen();

        }else if(
          document.webkitExitFullscreen
        ){

          document.webkitExitFullscreen();
        }
      }

    }catch(e){}
  }
);

document.addEventListener(
  "touchmove",
  e => e.preventDefault(),
  {passive:false}
);

resetGame();
draw();
loop();
</script>

</body>
</html>
