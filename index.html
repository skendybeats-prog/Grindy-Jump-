<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Grindy Jump V5</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#061309;
 font-family:Arial,sans-serif;
 touch-action:none;
}

canvas{
 display:block;
 width:100%;
 height:100%;
}

#ui{
 position:fixed;
 top:max(12px,env(safe-area-inset-top));
 left:0;
 width:100%;
 padding:0 15px;
 display:flex;
 justify-content:space-between;
 color:white;
 font-weight:900;
 font-size:18px;
 text-shadow:0 2px 5px #000;
 pointer-events:none;
 z-index:5;
}

#score{
 font-size:23px;
}

#start{
 position:fixed;
 inset:0;
 z-index:10;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 text-align:center;
 color:white;
 padding:25px;
 background:
 radial-gradient(circle at 50% 30%,#216b35aa,transparent 45%),
 linear-gradient(#061309ee,#0d3218f5);
}

#start h1{
 margin:0 0 8px;
 font-size:clamp(40px,13vw,62px);
 text-shadow:0 5px 15px #000;
}

#start p{
 max-width:420px;
 font-size:17px;
 line-height:1.45;
 white-space:pre-line;
}

button{
 border:0;
 border-radius:20px;
 padding:16px 34px;
 background:#39c45a;
 color:white;
 font-size:20px;
 font-weight:900;
 box-shadow:0 5px 0 #176d2b;
}

button:active{
 transform:translateY(3px);
 box-shadow:0 2px 0 #176d2b;
}

#controls{
 position:fixed;
 z-index:6;
 left:0;
 right:0;
 bottom:max(18px,env(safe-area-inset-bottom));
 display:flex;
 justify-content:space-between;
 padding:0 18px;
 pointer-events:none;
}

.ctrl{
 pointer-events:auto;
 width:78px;
 height:78px;
 padding:0;
 border-radius:50%;
 background:#123d1dcc;
 border:2px solid #ffffff55;
 font-size:38px;
 box-shadow:0 5px 15px #0007;
}

#hint{
 position:fixed;
 z-index:5;
 bottom:max(108px,calc(env(safe-area-inset-bottom) + 108px));
 width:100%;
 text-align:center;
 color:white;
 font-size:13px;
 text-shadow:0 2px 4px #000;
 pointer-events:none;
}

#fullscreen{
 position:fixed;
 right:12px;
 top:max(55px,calc(env(safe-area-inset-top) + 45px));
 z-index:6;
 width:44px;
 height:44px;
 padding:0;
 border-radius:14px;
 font-size:20px;
 background:#123d1dcc;
}

.hidden{
 display:none!important;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
 <span>🌿 GRINDY JUMP</span>
 <span id="score">0</span>
</div>

<button id="fullscreen">⛶</button>

<div id="hint">← → pour te déplacer • récupère 🌿</div>

<div id="controls">
 <button class="ctrl" id="left">‹</button>
 <button class="ctrl" id="right">›</button>
</div>

<div id="start">

 <h1>🌿 GRINDY JUMP</h1>

 <p id="message">
 Grinde de feuille en feuille,
 récupère les têtes 🌿
 et monte le plus haut possible !

 ← → pour te déplacer
 </p>

 <button id="play">JOUER</button>

</div>

<script>

/* =====================================================
   GRINDY JUMP V5
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr;

let player;
let platforms=[];
let collectibles=[];
let particles=[];
let leaves=[];
let stars=[];

let running=false;
let last=0;

let cameraY=0;
let score=0;
let best=Number(localStorage.getItem("grindyBest")||0);

let moveLeft=false;
let moveRight=false;

let audio=null;


/* =====================================================
   AUDIO
===================================================== */

function initAudio(){

 if(audio)return;

 const AudioContext=
  window.AudioContext||window.webkitAudioContext;

 if(!AudioContext)return;

 audio=new AudioContext();
}

function sound(freq,duration=.08,type="sine",volume=.035){

 if(!audio)return;

 const osc=audio.createOscillator();
 const gain=audio.createGain();

 osc.type=type;
 osc.frequency.value=freq;

 gain.gain.setValueAtTime(
  volume,
  audio.currentTime
 );

 gain.gain.exponentialRampToValueAtTime(
  .001,
  audio.currentTime+duration
 );

 osc.connect(gain);
 gain.connect(audio.destination);

 osc.start();
 osc.stop(audio.currentTime+duration);
}

function collectSound(){

 sound(520,.08,"triangle",.05);

 setTimeout(()=>{
  sound(780,.1,"triangle",.04);
 },45);
}

function bounceSound(){

 sound(190,.07,"square",.025);
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

 dpr=window.devicePixelRatio||1;

 W=innerWidth;
 H=innerHeight;

 canvas.width=W*dpr;
 canvas.height=H*dpr;

 ctx.setTransform(
  dpr,0,0,dpr,0,0
 );
}

addEventListener("resize",resize);
resize();


/* =====================================================
   DÉCOR
===================================================== */

function createDecor(){

 leaves=[];
 stars=[];

 for(let i=0;i<35;i++){

  leaves.push({
   x:Math.random()*W,
   y:Math.random()*H,
   size:15+Math.random()*35,
   speed:.1+Math.random()*.4,
   rotation:Math.random()*Math.PI
  });
 }

 for(let i=0;i<45;i++){

  stars.push({
   x:Math.random()*W,
   y:Math.random()*H,
   size:1+Math.random()*2
  });
 }
}

createDecor();


/* =====================================================
   NOUVELLE PARTIE
===================================================== */

function reset(){

 player={
  x:W*.45,
  y:H-180,
  w:38,
  h:48,
  vx:0,
  vy:0,
  rotation:0,
  grind:0,
  squash:0,
  on:false
 };

 platforms=[];
 collectibles=[];
 particles=[];

 score=0;
 cameraY=0;

 let x=W*.35;
 let y=H-90;

 platforms.push({
  x:x,
  y:y,
  w:Math.min(190,W*.44),
  h:18
 });

 for(let i=1;i<110;i++){

  const difficulty=Math.min(
   i/80,
   1
  );

  y-=
   75+
   Math.random()*40+
   difficulty*12;

  x=Math.max(
   15,
   Math.min(
    W-150,
    x+(Math.random()-.5)*
    (170+difficulty*60)
   )
  );

  const w=
   Math.max(
    95,
    155-
    difficulty*35+
    Math.random()*35
   );

  platforms.push({
   x:x,
   y:y,
   w:w,
   h:18
  });

  if(
   i>1 &&
   Math.random()<.8
  ){

   collectibles.push({
    x:x+w*.5,
    y:y-30,
    r:11,
    got:false,
    phase:Math.random()*Math.PI*2
   });
  }
 }

 createDecor();
}


/* =====================================================
   CONTRÔLES
===================================================== */

function bindControl(element,setter){

 element.addEventListener(
  "pointerdown",
  e=>{
   e.preventDefault();
   setter(true);

   try{
    element.setPointerCapture(e.pointerId);
   }catch(err){}
  }
 );

 element.addEventListener(
  "pointerup",
  e=>{
   e.preventDefault();
   setter(false);
  }
 );

 element.addEventListener(
  "pointercancel",
  ()=>setter(false)
 );

 element.addEventListener(
  "pointerleave",
  ()=>setter(false)
 );
}

bindControl(
 document.getElementById("left"),
 v=>moveLeft=v
);

bindControl(
 document.getElementById("right"),
 v=>moveRight=v
);


/* =====================================================
   CLAVIER
===================================================== */

addEventListener("keydown",e=>{

 if(
  e.code==="ArrowLeft"||
  e.code==="KeyA"
 )
  moveLeft=true;

 if(
  e.code==="ArrowRight"||
  e.code==="KeyD"
 )
  moveRight=true;

 if(
  e.code==="Space"||
  e.code==="ArrowUp"
 )
  jump();
});

addEventListener("keyup",e=>{

 if(
  e.code==="ArrowLeft"||
  e.code==="KeyA"
 )
  moveLeft=false;

 if(
  e.code==="ArrowRight"||
  e.code==="KeyD"
 )
  moveRight=false;
});


/* =====================================================
   SAUT
===================================================== */

function jump(){

 if(
  running &&
  player.on
 ){

  player.vy=-650;
  player.on=false;
  player.grind=0;

  bounceSound();
 }
}


/* =====================================================
   PARTICULES
===================================================== */

function particlesBurst(
 x,
 y,
 amount=10,
 type="leaf"
){

 for(let i=0;i<amount;i++){

  particles.push({

   x:x,
   y:y,

   vx:
    (Math.random()-.5)*
    (type==="spark"?280:180),

   vy:
    -Math.random()*
    (type==="spark"?300:220),

   life:
    .45+
    Math.random()*.6,

   size:
    2+
    Math.random()*4,

   type:type
  });
 }
}


/* =====================================================
   PLANTE GÉANTE
===================================================== */

function drawGiantPlant(){

 ctx.save();

 const baseY=
  H+100-
  cameraY*.13;

 /* tige */

 ctx.fillStyle="#123d18";

 ctx.fillRect(
  W/2-115,
  -H,
  230,
  baseY+H
 );

 /* nervures */

 ctx.strokeStyle="#1c6828";
 ctx.lineWidth=8;

 for(let i=0;i<9;i++){

  const y=
   baseY-
   i*105;

  ctx.beginPath();

  ctx.moveTo(W/2,y);

  ctx.quadraticCurveTo(
   W/2-170,
   y-45,
   W/2-230,
   y-95
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(W/2,y);

  ctx.quadraticCurveTo(
   W/2+170,
   y-45,
   W/2+230,
   y-95
  );

  ctx.stroke();
 }

 /* grosses feuilles */

 for(let i=0;i<13;i++){

  const y=
   baseY-
   80-
   i*82;

  const side=
   i%2===0?-1:1;

  ctx.save();

  ctx.translate(
   W/2+
   side*(80+(i%3)*30),
   y
  );

  ctx.rotate(
   side*.35
  );

  ctx.fillStyle=
   i%2?
   "#176b2a":
   "#218c38";

  ctx.beginPath();

  ctx.ellipse(
   0,
   0,
   105,
   42,
   0,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#2fa849";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
   -80,
   0
  );

  ctx.lineTo(
   80,
   0
  );

  ctx.stroke();

  ctx.restore();
 }

 ctx.restore();
}


/* =====================================================
   ARRIÈRE PLAN
===================================================== */

function drawBackground(){

 const gradient=
  ctx.createLinearGradient(
   0,0,0,H
  );

 gradient.addColorStop(
  0,
  "#55bfe8"
 );

 gradient.addColorStop(
  .55,
  "#b8e8c0"
 );

 gradient.addColorStop(
  1,
  "#dff5cf"
 );

 ctx.fillStyle=gradient;

 ctx.fillRect(
  0,
  0,
  W,
  H
 );

 /* soleil */

 ctx.fillStyle="#fff4a8aa";

 ctx.beginPath();

 ctx.arc(
  W*.82,
  H*.17,
  55,
  0,
  Math.PI*2
 );

 ctx.fill();

 /* petites étoiles / poussières */

 for(const s of stars){

  let y=
   (s.y+
   cameraY*.08)
   %H;

  ctx.fillStyle="#ffffff77";

  ctx.beginPath();

  ctx.arc(
   s.x,
   y,
   s.size,
   0,
   Math.PI*2
  );

  ctx.fill();
 }
}


/* =====================================================
   PLATEFORMES
===================================================== */

function drawPlatforms(){

 for(const p of platforms){

  const y=
   p.y-cameraY;

  if(
   y<-40||
   y>H+40
  )
   continue;

  /* ombre */

  ctx.fillStyle="#123d1855";

  ctx.beginPath();

  ctx.ellipse(
   p.x+p.w/2,
   y+10,
   p.w/2,
   12,
   0,
   0,
   Math.PI*2
  );

  ctx.fill();

  /* feuille */

  ctx.fillStyle="#43b64f";

  ctx.beginPath();

  ctx.ellipse(
   p.x+p.w/2,
   y,
   p.w/2,
   15,
   0,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#277d32";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
   p.x+15,
   y
  );

  ctx.lineTo(
   p.x+p.w-15,
   y
  );

  ctx.stroke();
 }
}


/* =====================================================
   COLLECTIBLES
===================================================== */

function drawCollectibles(){

 for(const q of collectibles){

  if(q.got)
   continue;

  const y=
   q.y-
   cameraY+
   Math.sin(
    q.phase+
    performance.now()/180
   )*5;

  if(
   y<-30||
   y>H+30
  )
   continue;

  /* halo */

  ctx.fillStyle="#b8ff6533";

  ctx.beginPath();

  ctx.arc(
   q.x,
   y,
   20,
   0,
   Math.PI*2
  );

  ctx.fill();

  /* tête */

  ctx.fillStyle="#b8ff65";

  ctx.beginPath();

  ctx.arc(
   q.x,
   y,
   q.r,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#26752f";

  ctx.font="bold 13px Arial";
  ctx.textAlign="center";

  ctx.fillText(
   "🌿",
   q.x,
   y+5
  );
 }
}


/* =====================================================
   PERSONNAGE
===================================================== */

function drawPlayer(){

 const screenY=
  player.y-cameraY;

 const centerX=
  player.x+
  player.w/2;

 const centerY=
  screenY+
  player.h/2;

 ctx.save();

 ctx.translate(
  centerX,
  centerY
 );

 /* animation grind */

 let bounce=
  player.on?
  Math.sin(
   performance.now()/90
  )*2:
  0;

 let scaleX=
  1+
  player.squash*.08;

 let scaleY=
  1-
  player.squash*.08;

 ctx.scale(
  scaleX,
  scaleY
 );

 let angle=
  player.vx*.0007;

 if(player.grind>0)
  angle+=Math.sin(
   performance.now()/70
  )*.12;

 ctx.rotate(angle);


 /* planche / grind */

 if(player.grind>0){

  ctx.strokeStyle="#8a5a2b";
  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(-27,20);
  ctx.lineTo(27,20);

  ctx.stroke();

  ctx.fillStyle="#ffe66d";

  for(let i=0;i<3;i++){

   ctx.beginPath();

   ctx.arc(
    -15+i*15,
    24+
    Math.sin(
     performance.now()/60+i
    )*4,
    3,
    0,
    Math.PI*2
   );

   ctx.fill();
  }
 }


 /* corps */

 ctx.fillStyle="#d8a66a";

 ctx.fillRect(
  -11,
  -5,
  22,
  27
 );


 /* tête */

 ctx.fillStyle="#39a94b";

 ctx.beginPath();

 ctx.arc(
  0,
  -18+bounce,
  21,
  0,
  Math.PI*2
 );

 ctx.fill();


 /* feuilles latérales */

 ctx.fillStyle="#175c27";

 ctx.beginPath();

 ctx.ellipse(
  -17,
  -8,
  17,
  8,
  -.65,
  0,
  Math.PI*2
 );

 ctx.ellipse(
  17,
  -8,
  17,
  8,
  .65,
  0,
  Math.PI*2
 );

 ctx.fill();


 /* yeux */

 ctx.fillStyle="#111";

 ctx.fillRect(
  -10,
  -22+bounce,
  5,
  6
 );

 ctx.fillRect(
  5,
  -22+bounce,
  5,
  6
 );


 /* sourire */

 ctx.strokeStyle="#fff";

 ctx.lineWidth=3;

 ctx.beginPath();

 ctx.arc(
  0,
  -14+bounce,
  8,
  .15,
  1.2
 );

 ctx.stroke();


 ctx.restore();
}


/* =====================================================
   PARTICULES
===================================================== */

function drawParticles(){

 for(const p of particles){

  const alpha=
   Math.max(
    0,
    p.life*1.6
   );

  ctx.globalAlpha=alpha;

  ctx.fillStyle=
   p.type==="spark"?
   "#fff36b":
   "#b8ff65";

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y-cameraY,
   p.size,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;
 }
}


/* =====================================================
   AFFICHAGE GLOBAL
===================================================== */

function draw(){

 drawBackground();

 drawGiantPlant();

 drawPlatforms();

 drawCollectibles();

 drawParticles();

 drawPlayer();
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

 running=false;

 best=Math.max(
  best,
  score
 );

 localStorage.setItem(
  "grindyBest",
  best
 );

 document.querySelector("#start h1")
  .textContent=
  "🌿 GAME OVER";

 document.getElementById("message")
  .textContent=
  "Score : "+
  score+
  "\nRecord : "+
  best+
  "\n\nPrêt pour un nouveau grind ?";

 document.getElementById("play")
  .textContent=
  "REJOUER";

 document.getElementById("start")
  .classList.remove("hidden");
}


/* =====================================================
   BOUCLE PRINCIPALE
===================================================== */

function loop(time){

 if(!running)
  return;

 let dt=
  Math.min(
   (time-last)/1000,
   .03
  );

 last=time;


 /* mouvement horizontal */

 const direction=
  (moveRight?1:0)-
  (moveLeft?1:0);

 player.vx+=
  (
   direction*950-
   player.vx*7
  )*dt;

 player.x+=
  player.vx*dt;


 /* bord de l'écran */

 if(player.x>W)
  player.x=-player.w;

 if(player.x<-player.w)
  player.x=W;


 /* gravité */

 player.vy+=
  1450*dt;

 const oldY=
  player.y;

 player.y+=
  player.vy*dt;


 player.on=false;


 /* collisions */

 for(const p of platforms){

  if(
   player.x+player.w>p.x &&
   player.x<p.x+p.w &&
   oldY+player.h<=p.y &&
   player.y+player.h>=p.y &&
   player.vy>=0
  ){

   player.y=
    p.y-player.h;

   player.vy=-650;

   player.on=true;

   player.grind=.25;

   player.squash=1;

   bounceSound();

   particlesBurst(
    player.x+19,
    p.y,
    8,
    "leaf"
   );

   break;
  }
 }


 /* collecte */

 for(const q of collectibles){

  if(
   !q.got &&
   player.x+player.w>
    q.x-q.r &&
   player.x<
    q.x+q.r &&
   player.y<
    q.y+q.r &&
   player.y+player.h>
    q.y-q.r
  ){

   q.got=true;

   score+=10;

   player.grind=.5;

   collectSound();

   particlesBurst(
    q.x,
    q.y,
    16,
    "spark"
   );
  }
 }


 /* animation */

 player.grind=
  Math.max(
   0,
   player.grind-dt
  );

 player.squash=
  Math.max(
   0,
   player.squash-dt*5
  );


 /* =================================================
    CAMÉRA AMÉLIORÉE
 ================================================= */

 const targetCamera=
  Math.max(
   0,
   player.y-H*.48
  );

 cameraY+=
  (
   targetCamera-cameraY
  )*.10;


 /* score */

 score=Math.max(
  score,
  Math.floor(
   cameraY/10
  )
 );

 document.getElementById("score")
  .textContent=
  score;


 /* particules */

 for(const p of particles){

  p.x+=
   p.vx*dt;

  p.vy+=
   500*dt;

  p.y+=
   p.vy*dt;

  p.life-=dt;
 }

 particles=
  particles.filter(
   p=>p.life>0
  );


 /* chute définitive */

 if(
  player.y-cameraY>
  H+180
 ){

  gameOver();

  return;
 }


 draw();

 requestAnimationFrame(loop);
}


/* =====================================================
   PLEIN ÉCRAN
===================================================== */

document
 .getElementById("fullscreen")
 .onclick=async()=>{

 try{

  if(!document.fullscreenElement){

   await document.documentElement
    .requestFullscreen?.();

  }else{

   await document.exitFullscreen?.();
  }

 }catch(e){}
};


/* =====================================================
   JOUER
===================================================== */

document
 .getElementById("play")
 .onclick=()=>{

 initAudio();

 if(audio &&
    audio.state==="suspended"){

  audio.resume();
 }

 document.getElementById("start")
  .classList.add("hidden");

 reset();

 running=true;

 last=performance.now();

 requestAnimationFrame(loop);
};


/* =====================================================
   EMPÊCHER LE SCROLL IPHONE
===================================================== */

document.addEventListener(
 "touchmove",
 e=>e.preventDefault(),
 {passive:false}
);

</script>

</body>
</html>
