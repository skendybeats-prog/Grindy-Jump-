<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grindy Jump</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b0b;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;top:12px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 18px;color:white;font-size:20px;font-weight:bold;pointer-events:none;text-shadow:0 2px 4px #000}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center;background:linear-gradient(#071b0bdd,#123b18dd)}
#start h1{font-size:48px;margin:0 0 10px}
#start p{font-size:18px;margin:5px 20px 25px}
button{border:0;border-radius:18px;padding:16px 35px;background:#39c45a;color:white;font-size:20px;font-weight:bold}
.hidden{display:none!important}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <span>🌿 GRINDY JUMP</span>
  <span id="score">0</span>
</div>

<div id="start">
  <h1>🌿 GRINDY JUMP</h1>
  <p>Saute de feuille en feuille et va le plus loin possible !</p>
  <button id="play">JOUER</button>
</div>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W,H,dpr;
function resize(){
 dpr=devicePixelRatio||1;
 W=innerWidth;H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

let player,platforms,score,running=false,cam=0,last=0;

function reset(){
 player={x:90,y:H-170,w:38,h:48,vy:0,on:false};
 platforms=[];
 let y=H-100,x=40;
 for(let i=0;i<40;i++){
   platforms.push({x,y,w:120+Math.random()*70,h:18});
   x+=120+Math.random()*100;
   y-=65+Math.random()*35;
 }
 score=0;cam=0;
}

function jump(){
 if(!running)return;
 if(player.on){player.vy=-650;player.on=false}
}

addEventListener("pointerdown",jump);
addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp")jump()});

document.getElementById("play").onclick=()=>{
 document.getElementById("start").classList.add("hidden");
 reset();running=true;last=performance.now();requestAnimationFrame(loop);
};

function drawPlant(){
 ctx.save();
 ctx.translate(W/2,H+40-cam*.12);
 ctx.fillStyle="#123d18";
 ctx.fillRect(-180,-H-80,360,H+100);
 for(let i=0;i<11;i++){
   let yy=-70-i*70;
   ctx.fillStyle=i%2?"#176b2a":"#218c38";
   ctx.beginPath();
   ctx.ellipse(-80+(i%3)*80,yy,90,38,0,0,Math.PI*2);
   ctx.fill();
 }
 ctx.restore();
}

function drawPlayer(){
 let x=player.x,y=player.y-cam;
 ctx.fillStyle="#d8a66a";
 ctx.fillRect(x+10,y+17,20,25);
 ctx.fillStyle="#39a94b";
 ctx.beginPath();ctx.arc(x+19,y+12,19,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#175c27";
 ctx.beginPath();
 ctx.ellipse(x+4,y+20,15,8,-.6,0,Math.PI*2);
 ctx.ellipse(x+34,y+20,15,8,.6,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#111";
 ctx.fillRect(x+11,y+8,4,5);ctx.fillRect(x+24,y+8,4,5);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#87d9ff");g.addColorStop(1,"#d8f5cf");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 drawPlant();

 for(const p of platforms){
   let yy=p.y-cam;
   if(yy>-30&&yy<H+30){
     ctx.fillStyle="#43b64f";
     ctx.beginPath();
     ctx.ellipse(p.x+p.w/2,yy+5,p.w/2,12,0,0,Math.PI*2);
     ctx.fill();
     ctx.fillStyle="#277d32";
     ctx.fillRect(p.x+10,yy+8,p.w-20,7);
   }
 }
 drawPlayer();
}

function loop(t){
 if(!running)return;
 let dt=Math.min((t-last)/1000,.03);last=t;

 player.vy+=1450*dt;
 let oldY=player.y;
 player.y+=player.vy*dt;
 player.on=false;

 for(const p of platforms){
   if(player.x+player.w>p.x&&player.x<p.x+p.w&&
      oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.vy>=0){
     player.y=p.y-player.h;
     player.vy=0;
     player.on=true;
   }
 }

 cam=Math.max(cam, H-230-player.y);
 score=Math.max(score,Math.floor(cam/10));
 document.getElementById("score").textContent=score;

 if(player.y-cam>H+100){gameOver();return}

 draw();
 requestAnimationFrame(loop);
}

function gameOver(){
 running=false;
 document.getElementById("start").classList.remove("hidden");
 document.querySelector("#start h1").textContent="🌿 GAME OVER";
 document.querySelector("#start p").textContent="Score : "+score+" — Réessaie !";
 document.getElementById("play").textContent="REJOUER";
}
</script>
</body>
</html>
